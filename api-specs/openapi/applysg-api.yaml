openapi: 3.1.0
info:
  title: ApplySG API
  version: "2026-10"
  summary: Manage forms, submissions, documents and webhooks on ApplySG.
  description: |
    The ApplySG REST API lets agency systems read form definitions, create and
    update submissions, retrieve generated documents and manage webhook
    subscriptions.

    All requests are authenticated with an OAuth 2.0 bearer token obtained with
    the client-credentials grant. See the Integrator Guide for registration and
    environments.

    **This specification contains dummy data for demonstration purposes.**
  contact:
    name: ApplySG support
    email: applysg-support@tech.gov.sg
  x-logo:
    url: https://raw.githubusercontent.com/louissteen/applysg-docs/main/branding/logo-light.svg
servers:
  - url: https://api.apply.gov.sg/v1
    description: Production
  - url: https://api.sandbox.apply.gov.sg/v1
    description: Sandbox
security:
  - oauth2: []
tags:
  - name: Forms
    description: Published form definitions and their versions.
  - name: Submissions
    description: Applications submitted through the portal or created via API.
  - name: Documents
    description: Attachments uploaded by applicants and documents generated by lifecycle actions.
  - name: Webhooks
    description: Subscriptions that deliver submission and form events to your endpoint.
  - name: Workspace
    description: Workspace metadata, teams and audit events.
paths:
  /forms:
    get:
      tags: [Forms]
      summary: List forms
      operationId: listForms
      description: Returns the forms in the workspace the token belongs to. Only published forms are returned unless `status` is specified.
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of forms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Form'
                  next_cursor:
                    type: [string, 'null']
                    example: eyJpZCI6ImZybV8wMUhYIn0
              example:
                data:
                  - id: frm_01HXK3V9Q2M7R8T4W5Y6Z7A8B9
                    slug: hawker-stall-licence-renewal
                    name: Hawker Stall Licence Renewal
                    status: published
                    version: 4
                    classification: restricted_sensitive_normal
                    published_at: "2026-10-21T02:15:00Z"
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /forms/{formId}:
    get:
      tags: [Forms]
      summary: Get a form
      operationId: getForm
      parameters:
        - $ref: '#/components/parameters/FormId'
      responses:
        '200':
          description: The form definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
  /forms/{formId}/versions:
    get:
      tags: [Forms]
      summary: List form versions
      operationId: listFormVersions
      parameters:
        - $ref: '#/components/parameters/FormId'
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FormVersion'
  /submissions:
    get:
      tags: [Submissions]
      summary: List submissions
      operationId: listSubmissions
      parameters:
        - name: form_id
          in: query
          schema:
            type: string
        - name: stage
          in: query
          description: Filter by current lifecycle stage key.
          schema:
            type: string
            example: under_review
        - name: updated_since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of submissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Submission'
                  next_cursor:
                    type: [string, 'null']
    post:
      tags: [Submissions]
      summary: Create a submission
      operationId: createSubmission
      description: |
        Creates a submission on behalf of an applicant, for example when an
        agency counter officer keys in a paper form. Requires the
        `submissions:write` scope. The submission starts in the `submitted`
        stage unless `as_draft` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
            example:
              form_id: frm_01HXK3V9Q2M7R8T4W5Y6Z7A8B9
              applicant:
                id_type: nric
                id_value: S9000001A
                name: Tan Wei Ming
                email: weiming.tan@example.com
                mobile: "+6591234567"
              fields:
                licence_number: HSL-2021-0457
                stall_location: "Block 505, Jurong West St 52, #01-12"
                changed_hands: "No"
              channel: counter
      responses:
        '201':
          description: Submission created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/{submissionId}:
    get:
      tags: [Submissions]
      summary: Get a submission
      operationId: getSubmission
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: The submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Submissions]
      summary: Update submission fields
      operationId: updateSubmission
      description: Updates field values on a submission that is not locked. Submissions in `approved`, `rejected` or `closed` stages are locked.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  additionalProperties: true
                note:
                  type: string
                  description: Internal note recorded in the case history.
      responses:
        '200':
          description: Updated submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '409':
          description: The submission is locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: submission_locked
                message: Submission ASG-2026-004512 is in stage 'approved' and cannot be modified.
  /submissions/{submissionId}/transition:
    post:
      tags: [Submissions]
      summary: Transition a submission
      operationId: transitionSubmission
      description: Performs a lifecycle action (for example `approve`) as the integration actor. The action must be available on the current stage.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  example: approve
                comment:
                  type: string
                  example: Inspection passed on 24 Oct 2026.
      responses:
        '200':
          description: Submission after transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '422':
          description: Action not available on the current stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /submissions/{submissionId}/documents:
    get:
      tags: [Documents]
      summary: List documents on a submission
      operationId: listSubmissionDocuments
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Attachments and generated documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
  /documents/{documentId}/download:
    get:
      tags: [Documents]
      summary: Download a document
      operationId: downloadDocument
      description: Returns a short-lived (15 minute) signed URL for the file.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            example: doc_01HXM0A1B2C3D4E5F6G7H8J9K0
      responses:
        '200':
          description: Signed download URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      operationId: listWebhooks
      responses:
        '200':
          description: Subscriptions owned by this client.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
            example:
              url: https://licensing.agency.gov.sg/hooks/applysg
              events: [submission.created, submission.stage_changed]
              form_ids: [frm_01HXK3V9Q2M7R8T4W5Y6Z7A8B9]
      responses:
        '201':
          description: Subscription created. The signing secret is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWithSecret'
  /webhooks/{webhookId}:
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      operationId: deleteWebhook
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
  /webhooks/{webhookId}/deliveries:
    get:
      tags: [Webhooks]
      summary: List recent deliveries
      operationId: listWebhookDeliveries
      description: The last 7 days of delivery attempts, newest first.
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery attempts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
  /workspace:
    get:
      tags: [Workspace]
      summary: Get the current workspace
      operationId: getWorkspace
      responses:
        '200':
          description: Workspace the token belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
  /workspace/audit-events:
    get:
      tags: [Workspace]
      summary: List audit events
      operationId: listAuditEvents
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit events, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  next_cursor:
                    type: [string, 'null']
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Client-credentials grant. Scopes are granted when the integration is registered.
      flows:
        clientCredentials:
          tokenUrl: https://api.apply.gov.sg/v1/oauth/token
          scopes:
            forms:read: Read form definitions
            submissions:read: Read submissions and documents
            submissions:write: Create, update and transition submissions
            webhooks:manage: Manage webhook subscriptions
  parameters:
    FormId:
      name: formId
      in: path
      required: true
      schema:
        type: string
        example: frm_01HXK3V9Q2M7R8T4W5Y6Z7A8B9
    SubmissionId:
      name: submissionId
      in: path
      required: true
      description: Submission ID or public reference (for example `ASG-2026-004512`).
      schema:
        type: string
        example: sub_01HXM9P8N7M6L5K4J3H2G1F0E9
    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [draft, published, archived]
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_token
            message: The access token is expired or malformed.
    Forbidden:
      description: The token lacks the required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: scope_insufficient
            message: This operation requires the submissions:write scope.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_failed
            message: One or more fields are invalid.
            details:
              - field: fields.licence_number
                rule: pattern
                message: Must match HSL-YYYY-NNNN
  schemas:
    Form:
      type: object
      properties:
        id:
          type: string
          example: frm_01HXK3V9Q2M7R8T4W5Y6Z7A8B9
        slug:
          type: string
          example: hawker-stall-licence-renewal
        name:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        version:
          type: integer
        classification:
          type: string
          enum: [official_open, official_closed, restricted, restricted_sensitive_normal]
        published_at:
          type: [string, 'null']
          format: date-time
    FormDefinition:
      allOf:
        - $ref: '#/components/schemas/Form'
        - type: object
          properties:
            pages:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/Field'
            lifecycle:
              type: object
              properties:
                stages:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        example: under_review
                      name:
                        type: string
                      sla_working_days:
                        type: [integer, 'null']
    FormVersion:
      type: object
      properties:
        version:
          type: integer
        published_at:
          type: string
          format: date-time
        published_by:
          type: string
          example: lim_siew_ling@nea.gov.sg
        change_note:
          type: string
    Field:
      type: object
      properties:
        id:
          type: string
          example: licence_number
        type:
          type: string
          enum: [text, textarea, number, date, yes_no, dropdown, checkbox, file_upload, nric, uen, address]
        label:
          type: string
        required:
          type: boolean
        validation:
          type: object
          additionalProperties: true
    Applicant:
      type: object
      properties:
        id_type:
          type: string
          enum: [nric, fin, uen]
        id_value:
          type: string
          example: S9000001A
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
    Submission:
      type: object
      properties:
        id:
          type: string
          example: sub_01HXM9P8N7M6L5K4J3H2G1F0E9
        reference:
          type: string
          example: ASG-2026-004512
        form_id:
          type: string
        form_version:
          type: integer
        stage:
          type: string
          example: under_review
        stage_entered_at:
          type: string
          format: date-time
        sla_due_at:
          type: [string, 'null']
          format: date-time
        applicant:
          $ref: '#/components/schemas/Applicant'
        fields:
          type: object
          additionalProperties: true
        channel:
          type: string
          enum: [portal, embed, api, counter]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SubmissionCreate:
      type: object
      required: [form_id, applicant, fields]
      properties:
        form_id:
          type: string
        applicant:
          $ref: '#/components/schemas/Applicant'
        fields:
          type: object
          additionalProperties: true
        channel:
          type: string
          enum: [api, counter]
          default: api
        as_draft:
          type: boolean
          default: false
    Document:
      type: object
      properties:
        id:
          type: string
          example: doc_01HXM0A1B2C3D4E5F6G7H8J9K0
        kind:
          type: string
          enum: [attachment, generated]
        field_id:
          type: [string, 'null']
          example: food_hygiene_certificate
        filename:
          type: string
          example: hygiene-cert-2026.pdf
        content_type:
          type: string
        size_bytes:
          type: integer
        scan_status:
          type: string
          enum: [pending, clean, infected]
        created_at:
          type: string
          format: date-time
    Webhook:
      type: object
      properties:
        id:
          type: string
          example: whk_01HXN1B2C3D4E5F6G7H8J9K0L1
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [submission.created, submission.stage_changed, submission.approved, submission.rejected, form.published]
        form_ids:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, paused, failing]
        created_at:
          type: string
          format: date-time
    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        form_ids:
          type: array
          items:
            type: string
          description: Restrict to specific forms. Omit for all forms in the workspace.
    WebhookWithSecret:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            secret:
              type: string
              description: HMAC-SHA256 signing secret. Shown once.
              example: whsec_4f9c1b7e2d8a6f3c5b1e9d7a2c4f6b8e
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
        event:
          type: string
        attempt:
          type: integer
        status_code:
          type: [integer, 'null']
        outcome:
          type: string
          enum: [delivered, retrying, failed]
        attempted_at:
          type: string
          format: date-time
    Workspace:
      type: object
      properties:
        id:
          type: string
          example: wsp_nea
        agency:
          type: string
          example: National Environment Agency
        plan:
          type: string
          enum: [starter, standard, enterprise]
        teams:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
    AuditEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          example: submission.field_revealed
        actor:
          type: string
          example: lim_siew_ling@nea.gov.sg
        target:
          type: string
          example: sub_01HXM9P8N7M6L5K4J3H2G1F0E9
        occurred_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
